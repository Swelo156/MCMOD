name: Build Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21' # Updated for Minecraft 1.21.1

      - name: Find and Make Gradle Executable
        run: |
          GRADLEW_PATH=$(find . -name gradlew)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found anywhere in the repository!"
            exit 1
          fi
          chmod +x "$GRADLEW_PATH"
          echo "FOUND_PATH=$(dirname "$GRADLEW_PATH")" >> $GITHUB_ENV

      - name: Build Mod with Gradle
        run: |
          cd ${{ env.FOUND_PATH }}
          ./gradlew build

      - name: Upload Mod Jar File
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mod-Jar
          path: '**/build/libs/*.jar'
