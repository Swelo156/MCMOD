name: Build Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make Gradle Executable
        # Replace YOUR_MOD_FOLDER_NAME with the exact name of your blue blurred folder
        run: chmod +x ./"UnstableCompanions"/gradlew

      - name: Build Mod with Gradle
        # Replace YOUR_MOD_FOLDER_NAME with the exact name of your blue blurred folder
        run: |
          cd ./"YOUR_MOD_FOLDER_NAME"
          ./gradlew build

      - name: Upload Mod Jar File
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mod-Jar
          path: '**/build/libs/*.jar'
