name: Build Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Find Mod Folder and Make Gradle Executable
        run: |
          GRADLEW_PATH=$(find . -name gradlew)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found anywhere!"
            exit 1
          fi
          chmod +x "$GRADLEW_PATH"
          echo "MOD_DIR=$(dirname "$GRADLEW_PATH")" >> $GITHUB_ENV

      - name: Build Mod with Gradle Wrapper
        run: |
          cd "${{ env.MOD_DIR }}"
          ./gradlew build

      - name: Upload Mod Jar File
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Mod-Jar
          path: '**/build/libs/*.jar'
